name: Build Extension Artifacts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
    paths:
      - '.github/workflows/build-extension-artifacts.yml'
      - 'src/**'
      - 'public/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tools/**'

jobs:
  build-artifacts:
    name: Build extension artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension zip
        run: npm run prod
        env:
          CI: true

      - name: Build Firefox extension zip
        run: npm run prod:firefox
        env:
          CI: true

      - name: Prepare named extension zips
        run: |
          mv jira-helper.zip jira-helper-chrome.zip
          test -f dist/manifest.json
          test -f dist-firefox/manifest.json
          test -f jira-helper-chrome.zip
          test -f jira-helper-firefox.zip

      - name: Upload combined extension zips
        uses: actions/upload-artifact@v7
        with:
          name: jira-helper
          path: |
            jira-helper-chrome.zip
            jira-helper-firefox.zip
          if-no-files-found: error
          retention-days: 14

      # GitHub re-zips whatever we upload. Upload dist/ so the downloaded
      # artifact zip has manifest.json at the root and Chrome can install it.
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: jira-helper-chrome
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: jira-helper-firefox
          path: dist-firefox/
          if-no-files-found: error
          retention-days: 14
