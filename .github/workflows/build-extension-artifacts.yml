name: Build Extension Artifacts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
    paths:
      - '.github/workflows/build-extension-artifacts.yml'
      - 'src/**'
      - 'public/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tools/**'

jobs:
  build-artifacts:
    name: Build extension artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension zip
        run: npm run prod
        env:
          CI: true

      - name: Build Firefox extension zip
        run: npm run prod:firefox
        env:
          CI: true

      - name: Prepare named extension zips
        run: |
          mv jira-helper.zip jira-helper-chrome.zip
          test -f jira-helper-chrome.zip
          test -f jira-helper-firefox.zip
          unzip -l jira-helper-chrome.zip | grep -q 'manifest.json'
          unzip -l jira-helper-firefox.zip | grep -q 'manifest.json'
          ls -lh jira-helper-chrome.zip jira-helper-firefox.zip

      # Artifact names cannot contain / \ : " < > | * ? or newlines (NTFS-safe).
      # GitHub wraps each artifact in an extra zip for download; inside are the
      # ready extension packages (unzip once → jira-helper-chrome.zip / firefox).
      - name: Sanitize artifact name
        id: artifact
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SAFE_REF=$(printf '%s' "$REF_NAME" | tr '/\\:"<>|*?' '-' | tr -d '\r\n')
          echo "prefix=jira-helper-${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome extension zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.prefix }}-chrome
          path: jira-helper-chrome.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox extension zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.prefix }}-firefox
          path: jira-helper-firefox.zip
          if-no-files-found: error
          retention-days: 14
