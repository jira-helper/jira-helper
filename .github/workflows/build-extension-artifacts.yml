name: Build Extension Artifacts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
    paths:
      - '.github/workflows/build-extension-artifacts.yml'
      - 'src/**'
      - 'public/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tools/**'

jobs:
  build-artifacts:
    name: Build extension artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension zip
        run: npm run prod
        env:
          CI: true

      - name: Build Firefox extension zip
        run: npm run prod:firefox
        env:
          CI: true

      - name: Verify unpacked builds
        run: |
          test -f dist/manifest.json
          test -f dist-firefox/manifest.json
          test -f jira-helper.zip
          test -f jira-helper-firefox.zip
          ls -lh dist/manifest.json dist-firefox/manifest.json jira-helper.zip jira-helper-firefox.zip

      # Artifact names cannot contain / \ : " < > | * ? or newlines (NTFS-safe).
      # GitHub always wraps artifacts in a zip; upload dist/ so one unzip yields
      # manifest.json at the root (Load unpacked), not a zip-in-zip.
      - name: Sanitize artifact name
        id: artifact
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SAFE_REF=$(printf '%s' "$REF_NAME" | tr '/\\:"<>|*?' '-' | tr -d '\r\n')
          echo "prefix=jira-helper-${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.prefix }}-chrome
          path: dist/
          retention-days: 14

      - name: Upload Firefox unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.prefix }}-firefox
          path: dist-firefox/
          retention-days: 14
