name: Build Extension Artifacts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
    paths:
      - '.github/workflows/build-extension-artifacts.yml'
      - 'src/**'
      - 'public/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tools/**'

jobs:
  build-artifacts:
    name: Build extension artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension zip
        run: npm run prod
        env:
          CI: true

      - name: Build Firefox extension zip
        run: npm run prod:firefox
        env:
          CI: true

      - name: Verify zip files
        run: |
          test -f jira-helper.zip
          test -f jira-helper-firefox.zip
          ls -lh jira-helper.zip jira-helper-firefox.zip

      # Artifact names cannot contain / \ : " < > | * ? or newlines (NTFS-safe).
      - name: Sanitize artifact name
        id: artifact
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          SAFE_REF=$(printf '%s' "$REF_NAME" | tr '/\\:"<>|*?' '-' | tr -d '\r\n')
          echo "name=jira-helper-extension-${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            jira-helper.zip
            jira-helper-firefox.zip
          retention-days: 14
